services:
  holdout:
    build: .
    ports:
      - "127.0.0.1:${HOLDOUT_HOST_PORT:-8100}:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HOLDOUT_MODEL: ${HOLDOUT_MODEL:-}
      HOLDOUT_API_BASE: ${HOLDOUT_API_BASE:-https://api.openai.com/v1}
      HOLDOUT_API_MODE: ${HOLDOUT_API_MODE:-responses}
      HOLDOUT_REASONING_EFFORT: ${HOLDOUT_REASONING_EFFORT:-low}
      HOLDOUT_MAX_OUTPUT_TOKENS: ${HOLDOUT_MAX_OUTPUT_TOKENS:-4096}
      HOLDOUT_MAX_PROVIDER_CALLS: ${HOLDOUT_MAX_PROVIDER_CALLS:-24}
      HOLDOUT_MAX_TOOL_CALLS: ${HOLDOUT_MAX_TOOL_CALLS:-36}
      HOLDOUT_MAX_TOKENS: ${HOLDOUT_MAX_TOKENS:-100000}
      HOLDOUT_PLAN_MAX_CANDIDATES: ${HOLDOUT_PLAN_MAX_CANDIDATES:-32}
      HOLDOUT_PLAN_MAX_SECONDS: ${HOLDOUT_PLAN_MAX_SECONDS:-30}
      HOLDOUT_GUIDED_MAX_INVESTIGATIONS: ${HOLDOUT_GUIDED_MAX_INVESTIGATIONS:-24}
      HOLDOUT_MAX_SECONDS: ${HOLDOUT_MAX_SECONDS:-180}
      HOLDOUT_WATCH_INTERVAL: ${HOLDOUT_WATCH_INTERVAL:-15}
    volumes:
      - holdout-runs:/app/.runtime/sessions
      - ./watch-inputs:/app/watch-inputs:ro

volumes:
  holdout-runs:
