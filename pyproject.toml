[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "holdout-lab"
version = "0.1.0"
description = "Investigate AI dataset leakage and compute evidence-backed minimum-cost repairs in FalkorDB."
requires-python = ">=3.12"
dependencies = [
  "falkordb==1.8.0",
  "falkordblite==0.10.0; sys_platform == 'linux' or sys_platform == 'darwin'",
  "fastapi==0.144.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "mcp==2.3.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "networkx==3.7"]

[project.scripts]
holdout = "holdout.cli:main"
holdout-mcp = "holdout.mcp_server:main"

[tool.setuptools]
packages = ["holdout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["native: exercises an actual local or configured FalkorDB engine"]
